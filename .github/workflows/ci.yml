name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-skills:
    name: Lint skills and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies by design: the linter is stdlib-only so it stays
      # runnable anywhere, including in a clone with no network.
      - name: Validate SKILL.md frontmatter, references and manifests
        run: python3 tools/validate_skills.py

  compile-examples:
    name: Compile published .jd examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # The PPA is the supported channel. It can lag a new Ubuntu series, so
      # fall back to the release archive rather than letting CI go red for a
      # packaging reason that has nothing to do with this repository.
      - name: Install jpipe
        run: |
          set -euo pipefail
          if sudo add-apt-repository -y ppa:mcscert/ppa \
             && sudo apt-get update -qq \
             && sudo apt-get install -y jpipe; then
            echo "installed from PPA"
          else
            echo "PPA unavailable; falling back to the release archive"
            tag=$(curl -fsSL https://api.github.com/repos/jpipe-mcscert/jpipe-compiler/releases/latest \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
            version=${tag#v}
            curl -fsSL -o /tmp/jpipe.zip \
              "https://github.com/jpipe-mcscert/jpipe-compiler/releases/download/${tag}/jpipe-${version}.zip"
            unzip -q /tmp/jpipe.zip -d /tmp/jpipe-dist
            jar=$(find /tmp/jpipe-dist -name '*.jar' | head -1)
            test -n "$jar" || { echo "no jar in the release archive" >&2; exit 1; }
            sudo tee /usr/local/bin/jpipe >/dev/null <<EOF
          #!/bin/sh
          exec java -jar "$jar" "\$@"
          EOF
            sudo chmod +x /usr/local/bin/jpipe
          fi
          jpipe --version

      # Every .jd this repository publishes -- fenced examples in the skill's
      # documentation and every fixture under tests/corpus -- must build. A doc
      # example that stopped compiling is a skill teaching a wrong pattern.
      - name: Compile every published example
        run: python3 tools/check_jd_blocks.py
