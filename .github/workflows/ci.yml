name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-skills:
    name: Lint skills and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies by design: the linter is stdlib-only so it stays
      # runnable anywhere, including in a clone with no network.
      - name: Validate SKILL.md frontmatter, references and manifests
        run: python3 tools/validate_skills.py

  compile-examples:
    name: Compile published .jd examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Graphviz is what the compiler shells out to for SVG and PNG. The
      # diagnostic pass below does not render, but a jpipe install without it is
      # half an install, and `jpipe doctor` reports it missing.
      - name: Install graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y graphviz

      # The release exposes the CLI jar directly, and setup-java above already
      # provides a runtime, so this is the whole install.
      - name: Install jpipe from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo jpipe-mcscert/jpipe-compiler \
            --pattern 'jpipe-cli-*.jar' --output "$HOME/jpipe-cli.jar"
          sudo tee /usr/local/bin/jpipe >/dev/null <<EOF
          #!/bin/sh
          exec java -jar "$HOME/jpipe-cli.jar" "\$@"
          EOF
          sudo chmod +x /usr/local/bin/jpipe
          jpipe --version

      # Every .jd this repository publishes -- fenced examples in the skill's
      # documentation and every fixture under tests/corpus -- must build. A doc
      # example that stopped compiling is a skill teaching a wrong pattern.
      - name: Compile every published example
        run: python3 tools/check_jd_blocks.py
