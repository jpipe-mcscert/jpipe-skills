name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-skills:
    name: Lint skills and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies by design: the linter is stdlib-only so it stays
      # runnable anywhere, including in a clone with no network.
      - name: Validate SKILL.md frontmatter, references and manifests
        run: python3 tools/validate_skills.py

  compile-examples:
    name: Compile published .jd examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The deb depends on openjdk-25-jre-headless and graphviz, so apt brings
      # the runtime and the renderer with it. No setup-java step, and this is
      # the same install path the README gives users.
      - name: Install jpipe
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:mcscert/ppa
          sudo apt-get install -y jpipe
          jpipe --version

      # Every .jd this repository publishes -- fenced examples in the skill's
      # documentation and every fixture under tests/corpus -- must build. A doc
      # example that stopped compiling is a skill teaching a wrong pattern.
      - name: Compile every published example
        run: python3 tools/check_jd_blocks.py
